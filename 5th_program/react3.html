<!DOCTYPE html>
<html>
<head>
<title>React Calculator</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
}

.app {
    text-align: center;
    padding: 50px;
}

h1 {
    color: #2563eb;
}

.card {
    background: white;
    width: 350px;
    margin: 30px auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

input {
    padding: 10px;
    width: 100px;
    margin: 10px;
}

button {
    margin: 5px;
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

.result {
    font-size: 25px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function Calculator() {

    const [num1, setNum1] = React.useState(0);
    const [num2, setNum2] = React.useState(0);
    const [result, setResult] = React.useState(0);

    return (
        <div className="card">

            <h2>Simple Calculator</h2>

            <input
                type="number"
                value={num1}
                onChange={(e) => setNum1(Number(e.target.value))}
            />

            <input
                type="number"
                value={num2}
                onChange={(e) => setNum2(Number(e.target.value))}
            />

            <br />

            <button onClick={() => setResult(num1 + num2)}>
                Add
            </button>

            <button onClick={() => setResult(num1 - num2)}>
                Subtract
            </button>

            <button onClick={() => setResult(num1 * num2)}>
                Multiply
            </button>

            <p className="result">
                Result: {result}
            </p>

        </div>
    );
}

function App() {

    return (
        <div className="app">

            <h1>React Functional Component</h1>

            <p>Example using JSX and useState</p>

            <Calculator />

        </div>
    );
}

const root = ReactDOM.createRoot(
    document.getElementById("root")
);

root.render(<App />);

</script>

</body>
</html>
