<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Counter</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f5f5f5;
            padding: 50px;
        }

        h1 {
            color: blue;
            font-size: 50px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            background-color: navy;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: green;
        }
    </style>
</head>

<body>

<h2>Dynamic Counter</h2>

<h1 id="count">0</h1>

<button onclick="increase()">Increase</button>
<button onclick="decrease()">Decrease</button>
<button onclick="reset()">Reset</button>

<script>

let number = 0;

function increase() {

    number++;

    document.getElementById("count").innerHTML = number;
}

function decrease() {

    number--;

    document.getElementById("count").innerHTML = number;
}

function reset() {

    number = 0;

    document.getElementById("count").innerHTML = number;
}

</script>

</body>
</html>
