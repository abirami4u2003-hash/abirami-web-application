<!DOCTYPE html>
<html>

<head>
    <title>React Movie Information</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f5f9;
            text-align: center;
            padding: 40px;
        }

        .card {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px gray;
        }

        h1 {
            color: #9333ea;
        }

        h2 {
            color: #333;
        }

        p {
            font-size: 18px;
        }

        .count {
            font-size: 35px;
            font-weight: bold;
            color: #9333ea;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background-color: #9333ea;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script type="text/babel">

        function Movie(props) {

            const [rating, setRating] = React.useState(5);

            function increase() {
                if (rating < 10) {
                    setRating(rating + 1);
                }
            }

            function decrease() {
                if (rating > 1) {
                    setRating(rating - 1);
                }
            }

            function reset() {
                setRating(5);
            }

            return (
                <div className="card">

                    <h2>Movie Information</h2>

                    <p><b>Movie:</b> {props.name}</p>
                    <p><b>Language:</b> {props.language}</p>
                    <p><b>Genre:</b> {props.genre}</p>

                    <hr />

                    <h2>Movie Rating</h2>

                    <p className="count">{rating}/10</p>

                    <button onClick={increase}>Increase</button>
                    <button onClick={decrease}>Decrease</button>
                    <button onClick={reset}>Reset</button>

                </div>
            );
        }

        function App() {
            return (
                <div>

                    <h1>Movie Application</h1>

                    <Movie
                        name="Leo"
                        language="Tamil"
                        genre="Action"
                    />

                </div>
            );
        }

        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );

        root.render(<App />);

    </script>

</body>
</html>
