<!DOCTYPE html>
<html>

<head>
    <title>React Book Information</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f5f9;
            text-align: center;
            padding: 40px;
        }

        .card {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px gray;
        }

        h1 {
            color: #ea580c;
        }

        h2 {
            color: #333;
        }

        p {
            font-size: 18px;
        }

        .count {
            font-size: 35px;
            font-weight: bold;
            color: #ea580c;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background-color: #ea580c;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script type="text/babel">

        function Book(props) {

            const [page, setPage] = React.useState(1);

            function nextPage() {
                setPage(page + 1);
            }

            function previousPage() {
                if (page > 1) {
                    setPage(page - 1);
                }
            }

            function reset() {
                setPage(1);
            }

            return (
                <div className="card">

                    <h2>Book Information</h2>

                    <p><b>Book:</b> {props.name}</p>
                    <p><b>Author:</b> {props.author}</p>
                    <p><b>Subject:</b> {props.subject}</p>

                    <hr />

                    <h2>Current Page</h2>

                    <p className="count">{page}</p>

                    <button onClick={nextPage}>Next</button>
                    <button onClick={previousPage}>Previous</button>
                    <button onClick={reset}>Reset</button>

                </div>
            );
        }

        function App() {
            return (
                <div>

                    <h1>Book Application</h1>

                    <Book
                        name="Python Basics"
                        author="John"
                        subject="Computer Science"
                    />

                </div>
            );
        }

        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );

        root.render(<App />);

    </script>

</body>
</html>
