<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Color Changer</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background-color: lightblue;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            color: white;
            cursor: pointer;
        }

        .red {
            background-color: red;
        }

        .green {
            background-color: green;
        }

        .blue {
            background-color: blue;
        }

        #box {
            width: 300px;
            height: 150px;
            margin: 30px auto;
            background-color: white;
            border: 2px solid black;
        }
    </style>
</head>

<body>

<h2>Dynamic Color Changer</h2>

<div id="box"></div>

<button class="red" onclick="changeColor('red')">Red</button>
<button class="green" onclick="changeColor('green')">Green</button>
<button class="blue" onclick="changeColor('blue')">Blue</button>

<script>
function changeColor(color) {

    let box = document.getElementById("box");

    box.style.backgroundColor = color;
}
</script>

</body>
</html>
