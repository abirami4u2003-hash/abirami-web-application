<!DOCTYPE html>
<html>
<head>
    <title>Email and Password Validation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: lightblue;
            padding: 50px;
        }

        form {
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 8px 20px;
            background-color: blue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<h2>Login Form</h2>

<form onsubmit="return validate()">

    Email:
    <input type="text" id="email">
    <br><br>

    Password:
    <input type="password" id="password">
    <br><br>

    <button type="submit">Login</button>

</form>

<p id="msg"></p>

<script>
function validate() {

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let msg = document.getElementById("msg");

    if (email == "" || password == "") {
        msg.innerHTML = "All fields are required";
        msg.style.color = "red";
        return false;
    }

    if (!email.includes("@")) {
        msg.innerHTML = "Enter a valid email";
        msg.style.color = "red";
        return false;
    }

    if (password.length < 6) {
        msg.innerHTML = "Password must contain 6 characters";
        msg.style.color = "red";
        return false;
    }

    msg.innerHTML = "Login successful!";
    msg.style.color = "green";

    return false;
}
</script>

</body>
</html>
